<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lexikon relacional — Karten</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene" id="scene">
    <div class="card3d" id="card3d">
      <!-- FRONT: Begriff + Definition -->
      <section class="face face-front">
        <div class="term-box"><h1 class="term" id="term">Begriff</h1></div>
        <p class="def" id="def"></p>
        <div class="foot">
          <span class="count" id="count"></span>
          <span class="cue">↕ Fragmente</span>
        </div>
      </section>

      <!-- BACK: Fragmente je Quelle -->
      <section class="face face-back">
        <h2 class="back-title" id="backTitle">Begriff</h2>
        <span class="back-sub">Fragmente in den Quellen</span>
        <div class="frags" id="frags"></div>
        <div class="foot"><span class="cue">↕ zurück</span></div>
      </section>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
